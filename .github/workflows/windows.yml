name: Windows build + installer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(MusicCreativeLab VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Try to fetch the Steinberg ASIO SDK (optional, GPLv3)
        id: asio
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.steinberg.net/asiosdk" -OutFile asiosdk.zip -MaximumRedirection 10
          Expand-Archive asiosdk.zip -DestinationPath asiosdk
          $h = Get-ChildItem -Recurse -Path asiosdk -Filter iasiodrv.h | Select-Object -First 1
          if (-not $h) { throw "ASIO SDK headers not found" }
          $dir = $h.Directory.Parent.FullName
          "dir=$dir" >> $env:GITHUB_OUTPUT
          Write-Host "ASIO SDK at $dir"

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ runner.os }}

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DMCL_ASIO_SDK_DIR="${{ steps.asio.outputs.dir }}"

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Self-test (renders the demos offline)
        shell: pwsh
        run: |
          $exe = "build/MusicCreativeLab_artefacts/Release/Music Creative Lab.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "build/MusicCreativeLab_artefacts/Release/selftest.log"
          if ($p.ExitCode -ne 0) { throw "Self-test failed" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=..\build\MusicCreativeLab_artefacts\Release" installer\MusicCreativeLab.iss
          Compress-Archive -Path "build/MusicCreativeLab_artefacts/Release/Music Creative Lab.exe", docs/GUIA.md -DestinationPath "dist/MusicCreativeLab-Portable-${{ steps.ver.outputs.version }}.zip"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MusicCreativeLab-Windows-${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Publish release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
